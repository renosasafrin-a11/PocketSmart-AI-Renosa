<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">PocketSmart AI</div>

            <ul class="nav-links">
                <li>
                    <a href="/">Home</a>
                </li>
                <li>
                    <a href="/auth/register">Register</a>
                </li>
            </ul>
        </div>
    </nav>


    <div class="form-container">

        <h1>Login</h1>

        <p>
            Login to your PocketSmart AI account.
        </p>

        <form
            action="/auth/login"
            method="POST"
        >

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>

        <p style="margin-top: 20px;">
            Don't have an account?
            <a href="/auth/register">
                Register here
            </a>
        </p>

    </div>


    <footer>
        <p>© 2026 PocketSmart AI</p>
    </footer>

</body>

</html>
