<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Planner - PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container">

            <div class="logo">
                PocketSmart AI
            </div>

            <ul class="nav-links">
                <li>
                    <a href="/">Home</a>
                </li>

                <li>
                    <a href="/planner/home">
                        Home Planner
                    </a>
                </li>

                <li>
                    <a href="/planner/party">
                        Party Planner
                    </a>
                </li>
            </ul>

        </div>
    </nav>


    <div class="form-container">

        <h1>💎 Jewelry Planner</h1>

        <p>
            Enter your jewelry preferences and get
            smart budget-friendly recommendations.
        </p>


        <form id="jewelryPlannerForm">

            <div class="form-group">

                <label>Budget (₹)</label>

                <input
                    type="number"
                    name="budget"
                    placeholder="Example: 5000"
                    required
                >

            </div>


            <div class="form-group">

                <label>Occasion</label>

                <select name="occasion" required>

                    <option value="">
                        Select occasion
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="Party">
                        Party
                    </option>

                    <option value="Engagement">
                        Engagement
                    </option>

                    <option value="Birthday">
                        Birthday
                    </option>

                    <option value="Daily Wear">
                        Daily Wear
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Jewelry Type</label>

                <select name="jewelry_type" required>

                    <option value="">
                        Select jewelry type
                    </option>

                    <option value="Earrings">
                        Earrings
                    </option>

                    <option value="Necklace">
                        Necklace
                    </option>

                    <option value="Bracelet">
                        Bracelet
                    </option>

                    <option value="Ring">
                        Ring
                    </option>

                    <option value="Bangles">
                        Bangles
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Outfit Description</label>

                <textarea
                    name="outfit_description"
                    placeholder="Example: Black saree with golden border"
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn"
            >
                Generate Recommendations
            </button>

        </form>

    </div>


    <div
        id="results"
        class="container"
        style="display: none;"
    >

        <h2 style="margin-top: 40px;">
            ✨ Your Jewelry Recommendations
        </h2>

        <div
            id="recommendationCards"
            class="cards"
        ></div>

    </div>


    <footer>

        <p>
            © 2026 PocketSmart AI
        </p>

    </footer>


    <script>

        const form =
            document.getElementById("jewelryPlannerForm");

        const results =
            document.getElementById("results");

        const recommendationCards =
            document.getElementById(
                "recommendationCards"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const formData =
                    new FormData(form);


                const button =
                    form.querySelector(
                        "button[type='submit']"
                    );


                button.disabled = true;

                button.textContent =
                    "Generating...";


                try {

                    const response =
                        await fetch(
                            "/planner/generate-jewelry",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    recommendationCards.innerHTML = "";


                    const recommendations =
                        data.result.recommendations;


                    recommendations.forEach(
                        function(item) {

                            const card =
                                document.createElement(
                                    "div"
                                );


                            card.className =
                                "card";


                            card.innerHTML = `

                                <h2>
                                    ${item.name}
                                </h2>

                                <p>
                                    <strong>
                                        Category:
                                    </strong>
                                    ${item.category}
                                </p>

                                <p>
                                    <strong>
                                        Price:
                                    </strong>
                                    ₹${item.price}
                                </p>

                                <p>
                                    <strong>
                                        Platform:
                                    </strong>
                                    ${item.platform}
                                </p>

                                <p>
                                    <strong>
                                        Why:
                                    </strong>
                                    ${item.reason}
                                </p>

                            `;


                            recommendationCards
                                .appendChild(card);

                        }
                    );


                    results.style.display =
                        "block";


                    results.scrollIntoView({
                        behavior: "smooth"
                    });


                } catch (error) {

                    alert(
                        "Something went wrong. Please try again."
                    );

                }


                button.disabled = false;

                button.textContent =
                    "Generate Recommendations";

            }
        );

    </script>

</body>

</html>
