<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="container">

            <div class="logo">
                PocketSmart AI
            </div>

            <ul class="nav-links">

                <li>
                    <a href="/">Home</a>
                </li>

                <li>
                    <a href="/auth/login">Login</a>
                </li>

            </ul>

        </div>

    </nav>


    <div class="form-container">

        <h1>Create Account</h1>

        <p>
            Register for your PocketSmart AI account.
        </p>


        <form
            action="/auth/register"
            method="POST"
        >

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
            >
                Register
            </button>

        </form>


        <p style="margin-top: 20px;">

            Already have an account?

            <a href="/auth/login">
                Login here
            </a>

        </p>

    </div>


    <footer>

        <p>
            © 2026 PocketSmart AI
        </p>

    </footer>


    <script src="/static/js/app.js"></script>

</body>

</html>
